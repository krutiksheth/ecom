<div class="flex nt-32 gap-6">
  <div class="w-3/4">
    <mat-stepper
      #stepper
      (selectionChange)="onStepChange($event)"
      [linear]="true"
      class="bg-white border border-gray-200 shadow-sm">
      <mat-step [completed]="completionStatus().address" label="Address">
        <div id="address-element"></div>
        <div class="flex justify-end mt-1">
          <mat-checkbox (change)="onSaveCheckboxChange($event)" [checked]="saveAddress">Save as default address
          </mat-checkbox>
        </div>
        <div class="flex justify-between mt-6">
          <button mat-stroked-button routerLink="/shop">Continue Shopping</button>
          <button [disabled]="!completionStatus().address" mat-stroked-button matStepperNext>Next</button>
        </div>
      </mat-step>
      <!--      <mat-step label="Shipping">-->
      <!--        <app-checkout-delivery></app-checkout-delivery>-->
      <!--        <div class="flex justify-between mt-6">-->
      <!--          <button mat-stroked-button matStepperPrevious>Back</button>-->
      <!--          <button mat-stroked-button matStepperNext>Next</button>-->
      <!--        </div>-->
      <!--      </mat-step>-->
      <mat-step [completed]="completionStatus().card" label="Payment">
        <div id="payment-element"></div>
        <div class="flex justify-between mt-6">
          <button mat-stroked-button matStepperPrevious>Back</button>
          <button [disabled]="!completionStatus().card" mat-stroked-button matStepperNext>Next</button>
        </div>
      </mat-step>
      <mat-step label="Confirmation">
        <app-checkout-review></app-checkout-review>
        <div class="flex justify-between mt-6">
          <button mat-stroked-button matStepperPrevious>Back</button>
          <button mat-stroked-button>Pay {{ basketService.totals()?.total | currency }}</button>
        </div>
      </mat-step>
    </mat-stepper>
    <pre>
      {{ completionStatus() | json }}
    </pre>
  </div>
  <div class="w-1/4">
    <app-order-summary></app-order-summary>
  </div>
</div>
